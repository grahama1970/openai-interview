services:
  control-plane:
    build: .
    image: openai-interview-control-plane:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENAI_INTERVIEW_API_KEY: "${OPENAI_INTERVIEW_API_KEY:-dev-key}"
      OPENAI_INTERVIEW_MEMORY_URL: "${OPENAI_INTERVIEW_MEMORY_URL:-http://host.docker.internal:8601}"
      OPENAI_INTERVIEW_ENABLE_HACK_VERIFY: "false"
      OPENAI_INTERVIEW_ENABLE_HACK_AUDIT: "false"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2); assert json.load(r)['status'] == 'ok'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
